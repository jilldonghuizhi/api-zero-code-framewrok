# 单 API 模板（testcases/apis/）：一个文件 = 一个可复用 API，不直接被收集
# 使用方式：在 testcases/flows/ 的业务文件里用 steps: - include: apis/your_api.yaml 引用
name: 示例接口
request:
  method: "${methods.POST}"          # 引用 data/share.yaml 的方法常量（勿硬编码 post/get）
  url: /demo/path                    # 相对路径；完整地址由 config.yaml 的 base_url 前缀拼接
  json:                              # 服务端收 JSON 时用 json:；收表单改用 form:
    key: value
extract_global:                      # 跨业务共享（下游步骤/其它业务用 ${shared_value} 取）
  shared_value: [json, $.data.shared_value, ""]
validate:                            # 多类型软断言（本 API 内全部执行后汇总）
  - status_code: { name: HTTP200, expected: "${expect.http_ok}" }
  - equals:
      name: 业务码为预期值
      actual: $.code
      expected: "${expect.success_code}"
